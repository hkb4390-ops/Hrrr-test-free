<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="description" content="HRRY Test App Free Key — Get a free one-hour test access key.">
<title>HRRY Test App Free Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05060a;
  --glass:rgba(18,21,31,.64);
  --line:rgba(255,255,255,.11);
  --white:#f8fafc;
  --muted:#9aa4b5;
  --blue:#5b7cff;
  --cyan:#21d4fd;
  --violet:#8b5cf6;
  --green:#31d391;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--white)}
body{min-height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center}
button{font:inherit}
.page{
  width:100%;min-height:100dvh;position:relative;overflow:hidden;
  background:
    radial-gradient(70% 55% at 12% 8%,rgba(91,124,255,.20),transparent 65%),
    radial-gradient(65% 50% at 90% 92%,rgba(33,212,253,.13),transparent 65%),
    radial-gradient(55% 45% at 58% 38%,rgba(139,92,246,.10),transparent 70%),
    #05060a;
}
.aurora{position:absolute;inset:-25%;pointer-events:none;filter:blur(70px);opacity:.7}
.orb{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:float 12s ease-in-out infinite}
.orb.one{width:260px;height:260px;left:3%;top:7%;background:rgba(75,104,255,.18)}
.orb.two{width:230px;height:230px;right:0;bottom:5%;background:rgba(24,202,239,.15);animation-delay:-4s}
.orb.three{width:180px;height:180px;left:48%;top:40%;background:rgba(142,77,255,.10);animation-delay:-7s}
.grain{position:absolute;inset:0;opacity:.035;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
.shell{
  position:relative;z-index:2;width:min(100%,480px);min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  width:100%;position:relative;overflow:hidden;text-align:center;
  padding:34px 24px 24px;border:1px solid var(--line);border-radius:34px;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  box-shadow:0 35px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09);
  backdrop-filter:blur(42px) saturate(145%);-webkit-backdrop-filter:blur(42px) saturate(145%);
  animation:cardIn .75s cubic-bezier(.16,1,.3,1) both;
}
.card:before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(125deg,rgba(255,255,255,.10),transparent 28%,transparent 72%,rgba(91,124,255,.08));
}
.logo{
  width:78px;height:78px;margin:0 auto 20px;border-radius:24px;position:relative;
  display:grid;place-items:center;font-size:30px;font-weight:900;letter-spacing:-2px;
  background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(91,124,255,.18) 48%,rgba(33,212,253,.12));
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 18px 50px rgba(70,100,255,.22),inset 0 1px 0 rgba(255,255,255,.2);
}
.logo:after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid rgba(255,255,255,.05);box-shadow:0 0 0 7px rgba(91,124,255,.035)}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);
  color:#cbd5e1;font-size:10px;font-weight:800;letter-spacing:1.15px;text-transform:uppercase;
  margin-bottom:14px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 1.7s ease-in-out infinite}
h1{
  font-size:clamp(28px,8vw,40px);line-height:1.05;letter-spacing:-1.8px;font-weight:900;
  background:linear-gradient(110deg,#fff 12%,#b9c7ff 48%,#55ddff 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{margin:13px auto 25px;max-width:330px;color:var(--muted);font-size:13px;line-height:1.65;font-weight:500}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.badge{
  padding:7px 10px;border-radius:11px;color:#dbeafe;font-size:10px;font-weight:800;
  background:rgba(91,124,255,.09);border:1px solid rgba(91,124,255,.18)
}
.action{
  width:100%;min-height:62px;border:0;border-radius:19px;cursor:pointer;color:#fff;
  position:relative;overflow:hidden;isolation:isolate;font-size:15px;font-weight:900;letter-spacing:.1px;
  background:linear-gradient(115deg,#4f6fff,#7457e8 48%,#12bfe4);
  background-size:220% 220%;animation:gradient 5s ease infinite,buttonGlow 2.7s ease-in-out infinite;
  box-shadow:0 18px 42px rgba(79,111,255,.28),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .18s ease;
}
.action:before{
  content:"";position:absolute;top:0;bottom:0;width:38%;left:-55%;z-index:-1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);
  transform:skewX(-18deg);animation:shine 3.5s ease-in-out infinite;
}
.action:active{transform:scale(.975);filter:brightness(.96)}
.action:disabled{cursor:wait;animation:none;opacity:.78}
.action-content{display:flex;align-items:center;justify-content:center;gap:10px}
.action-icon{font-size:19px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.2))}
.status{
  min-height:0;margin-top:14px;padding:0;border-radius:15px;font-size:11px;font-weight:800;
  line-height:1.5;overflow:hidden;opacity:0;transform:translateY(5px);
  transition:all .28s ease;
}
.status.show{opacity:1;transform:translateY(0);padding:11px 12px}
.status.success{color:#8ff0c4;background:rgba(49,211,145,.08);border:1px solid rgba(49,211,145,.20)}
.status.error{color:#ffb2c0;background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.20)}
.status.info{color:#b9d7ff;background:rgba(91,124,255,.08);border:1px solid rgba(91,124,255,.20)}
.footer{margin-top:19px;color:rgba(255,255,255,.35);font-size:9px;font-weight:700;letter-spacing:.25px}
.shield{display:inline-flex;align-items:center;gap:5px;margin-top:10px;color:rgba(255,255,255,.28);font-size:9px;font-weight:600}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(18px,-22px,0) scale(1.08)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes buttonGlow{0%,100%{box-shadow:0 18px 42px rgba(79,111,255,.25),inset 0 1px 0 rgba(255,255,255,.28)}50%{box-shadow:0 20px 52px rgba(33,212,253,.22),0 0 30px rgba(91,124,255,.12),inset 0 1px 0 rgba(255,255,255,.30)}}
@keyframes shine{0%,45%{left:-55%}70%,100%{left:125%}}
@media (min-width:520px){body{padding:20px}.shell{min-height:calc(100dvh - 40px)}.card{max-width:440px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="aurora"><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div></div>
  <div class="grain"></div>

  <main class="shell">
    <section class="card" aria-label="HRRY Test App Free Key">
      <div class="logo" aria-hidden="true">H<span style="opacity:.65">T</span></div>
      <div class="eyebrow"><span class="dot"></span> One Hour Test Access</div>
      <h1>HRRY Test App<br>Free Key</h1>
      <p class="subtitle">Get your free one-hour test access key and continue through the same secure key flow.</p>

      <div class="badges">
        <span class="badge">✦ FREE</span>
        <span class="badge">1 HOUR ACCESS</span>
        <span class="badge">SECURE FLOW</span>
      </div>

      <button id="free-key-btn" class="action" type="button" onclick="startFreeKeyFlow()">
        <span class="action-content">
          <span class="action-icon">🔑</span>
          <span>Get Free Key for One Hour Test App</span>
        </span>
      </button>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <div class="shield">🛡️ Secure device-based Free Key flow</div>
      <div class="footer">HRRY Test App • Free Key</div>
    </section>
  </main>
</div>

<script>
const FREE_KEY_BACKEND = "https://hrry-test-backend.onrender.com";
const FREE_KEY_DEVICE_STORAGE = "hrry_free_key_device_v2";
const DEVICE_STORAGE_KEY = "hrry_device_id";

let runtimeDeviceId = null;
let freeAccessExpiryTimer = null;

function cryptoRandomId(){
  if(window.crypto && crypto.getRandomValues){
    const a = new Uint32Array(4);
    crypto.getRandomValues(a);
    return Array.from(a).map(x => x.toString(36)).join("");
  }
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function getDeviceId(){
  if(runtimeDeviceId) return runtimeDeviceId;
  try{
    let id = localStorage.getItem(DEVICE_STORAGE_KEY);
    if(!id){
      id = "web_" + cryptoRandomId();
      localStorage.setItem(DEVICE_STORAGE_KEY,id);
    }
    runtimeDeviceId = String(id);
    return runtimeDeviceId;
  }catch(e){
    runtimeDeviceId = "web_" + cryptoRandomId();
    return runtimeDeviceId;
  }
}

function getFreeKeyDeviceId(){
  let id = getDeviceId();
  try{
    const saved = localStorage.getItem(FREE_KEY_DEVICE_STORAGE);
    if(saved) id = saved;
    else localStorage.setItem(FREE_KEY_DEVICE_STORAGE,id);
  }catch(e){}
  return String(id);
}

function getFreeAccessLocal(){
  try{
    return JSON.parse(localStorage.getItem("hrry_free_access_v1")) || null;
  }catch(e){ return null; }
}

function hasActiveFreeAccess(){
  const access = getFreeAccessLocal();
  if(!access || !access.key) return false;
  const expiresAt = Number(access.expiresAt || 0);
  const sameDevice = String(access.deviceId || "") === String(getDeviceId());
  if(!expiresAt || expiresAt <= Date.now() || !sameDevice){
    try{ localStorage.removeItem("hrry_free_access_v1"); }catch(e){}
    return false;
  }
  return true;
}

function formatRemaining(ms){
  const total = Math.max(0,Math.ceil(ms/1000));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  return h > 0 ? `${h}h ${String(m).padStart(2,"0")}m` : `${m}m ${String(s).padStart(2,"0")}s`;
}

function showStatus(message,type="info"){
  const box = document.getElementById("status");
  box.textContent = message;
  box.className = "status show " + type;
}

function updateButton(){
  const btn = document.getElementById("free-key-btn");
  if(!btn) return;
  const access = getFreeAccessLocal();
  const expiresAt = Number(access?.expiresAt || 0);
  const sameDevice = access && String(access.deviceId || "") === String(getDeviceId());

  if(expiresAt > Date.now() && sameDevice){
    btn.disabled = true;
    btn.innerHTML = `<span class="action-content"><span class="action-icon">🔓</span><span>Free Access Active • ${formatRemaining(expiresAt-Date.now())}</span></span>`;
    return;
  }
  btn.disabled = false;
  btn.innerHTML = `<span class="action-content"><span class="action-icon">🔑</span><span>Get Free Key for One Hour Test App</span></span>`;
}

function scheduleFreeAccessExpiry(){
  if(freeAccessExpiryTimer) clearTimeout(freeAccessExpiryTimer);
  const access = getFreeAccessLocal();
  const expiresAt = Number(access?.expiresAt || 0);
  updateButton();
  if(!expiresAt) return;

  const tick = setInterval(()=>{
    const a = getFreeAccessLocal();
    const exp = Number(a?.expiresAt || 0);
    if(exp > Date.now()) updateButton();
    else {
      clearInterval(tick);
      try{ localStorage.removeItem("hrry_free_access_v1"); }catch(e){}
      updateButton();
    }
  },1000);

  freeAccessExpiryTimer = setTimeout(()=>{
    clearInterval(tick);
    try{ localStorage.removeItem("hrry_free_access_v1"); }catch(e){}
    updateButton();
  },Math.max(0,expiresAt-Date.now())+100);
}

async function fetchFreeKeyApi(path,options={}){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(),20000);
  try{
    const response = await fetch(`${FREE_KEY_BACKEND}${path}`,{
      ...options, signal:controller.signal, cache:"no-store"
    });
    const data = await response.json().catch(()=>({}));
    return {response,data};
  }catch(error){
    if(error && error.name === "AbortError"){
      throw new Error("Free Key server ने समय पर जवाब नहीं दिया।");
    }
    throw new Error("Free Key server से connection नहीं हो पाया।");
  }finally{
    clearTimeout(timeout);
  }
}

async function startFreeKeyFlow(){
  if(hasActiveFreeAccess()){
    updateButton();
    showStatus("🔓 Free Access अभी active है। Expiry के बाद फिर से key flow शुरू कर सकते हैं।","success");
    return;
  }

  const btn = document.getElementById("free-key-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="action-content"><span class="action-icon">⏳</span><span>Creating Free Key…</span></span>`;
  showStatus("Free Key तैयार हो रही है…","info");

  try{
    const deviceId = getFreeKeyDeviceId();
    const {response,data} = await fetchFreeKeyApi("/api/free/start",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({deviceId})
    });

    if(!response.ok || !data.ok || !data.shrinkmeUrl){
      throw new Error(data.error || `Free Key server error (${response.status})`);
    }

    try{
      localStorage.setItem(FREE_KEY_DEVICE_STORAGE,deviceId);
      if(data.requestId){
        localStorage.setItem("hrry_free_key_request_id",String(data.requestId));
      }
    }catch(e){}

    showStatus("✅ Free Key link तैयार है। Key प्राप्त करने के लिए secure page खुल रहा है…","success");
    window.open(data.shrinkmeUrl,"_blank","noopener,noreferrer");
  }catch(error){
    console.error("Free key start error:",error);
    showStatus(`❌ ${error.message || "Free Key server से connection नहीं हो पाया।"}`,"error");
    updateButton();
  }
}

window.addEventListener("pageshow",()=>{
  getDeviceId();
  scheduleFreeAccessExpiry();
  updateButton();
});
</script>
</body>
</html>
